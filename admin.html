<body>

<header>

  <p>Admin Panel</p>
</header>


<!-- =========================
     ADMIN LOGIN

<div id="loginSection" class="container">

  <div class="card login-box">

    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin Password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="btn-green"
    >
      Login
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>

</div>


<!-- =========================
     ADMIN DASHBOARD
========================= -->

<div id="adminSection" class="container hidden">

  <div class="top-bar">

    <div>
      <h2>📋 Customer Orders</h2>
      <p id="adminEmailDisplay"></p>
    </div>

    <div>

      <button
        id="refreshBtn"
        class="btn-blue"
      >
        🔄 Refresh
      </button>

      <button
        id="logoutBtn"
        class="btn-red"
      >
        Logout
      </button>

    </div>

  </div>


  <div
    id="ordersMessage"
    class="message"
  ></div>


  <div id="ordersList">
    Loading orders...
  </div>

</div>


<script type="module">

  // =========================================
  // Firebase
  // =========================================

  import {
    initializeApp
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    getDoc,
    query,
    orderBy,
    doc,
    updateDoc,
    deleteDoc
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // =========================================
  // Firebase Config
  // =========================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyDw2kaA5y5unNlo7QDLLQ25ZbZHYiwtUoA",

    authDomain:
      "online-medicine-delivery-74346.firebaseapp.com",

    projectId:
      "online-medicine-delivery-74346",

    storageBucket:
      "online-medicine-delivery-74346.firebasestorage.app",

    messagingSenderId:
      "1061955108881",

    appId:
      "1:1061955108881:web:64f36ad79b5c612a2171b0",

    measurementId:
      "G-LMHDFF01QC"

  };


  // =========================================
  // Initialize Firebase
  // =========================================

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  // =========================================
  // HTML Elements
  // =========================================

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");

  const adminEmail =
    document.getElementById("adminEmail");

  const adminPassword =
    document.getElementById("adminPassword");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const loginMessage =
    document.getElementById("loginMessage");

  const ordersMessage =
    document.getElementById("ordersMessage");

  const ordersList =
    document.getElementById("ordersList");

  const adminEmailDisplay =
    document.getElementById("adminEmailDisplay");


  // =========================================
  // Show Message
  // =========================================

  function showMessage(
    element,
    text,
    type
  ) {

    element.textContent = text;

    element.className =
      "message " + type;

    element.style.display =
      "block";

  }


  // =========================================
  // Admin Login
  // =========================================

  loginBtn.addEventListener(
    "click",
    async function() {

      const email =
        adminEmail.value.trim();

      const password =
        adminPassword.value;


      if (!email || !password) {

        showMessage(
          loginMessage,
          "Admin Email এবং Password দিন.",
          "error"
        );

        return;
      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "Logging in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        console.error(
          "Login Error:",
          error
        );

        showMessage(
          loginMessage,
          "Login failed. Email অথবা Password ঠিক আছে কি না দেখুন.",
          "error"
        );

      }


      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login";

    }
  );


  // =========================================
  // Authentication State
  // =========================================

  onAuthStateChanged(
    auth,
    async function(user) {

      if (!user) {

        loginSection
          .classList
          .remove("hidden");

        adminSection
          .classList
          .add("hidden");

        return;

      }


      try {

        const adminRef =
          doc(
            db,
            "admins",
            user.uid
          );


        const adminSnapshot =
          await getDoc(adminRef);


        if (!adminSnapshot.exists()) {

          await signOut(auth);

          showMessage(
            loginMessage,
            "এই account Admin হিসেবে অনুমোদিত নয়.",
            "error"
          );

          return;

        }


        loginSection
          .classList
          .add("hidden");

        adminSection
          .classList
          .remove("hidden");


        adminEmailDisplay.textContent =
          "Admin: " + user.email;


        await loadOrders();


      } catch (error) {

        console.error(
          "Admin Verification Error:",
          error
        );

        showMessage(
          loginMessage,
          "Admin verification failed.",
          "error"
        );

      }

    }
  );


  // =========================================
  // Logout
  // =========================================

  logoutBtn.addEventListener(
    "click",
    async function() {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

      }

    }
  );


  // =========================================
  // Load Orders
  // =========================================

  async function loadOrders() {

    ordersList.innerHTML =
      "Loading orders...";


    try {

      const ordersRef =
        collection(
          db,
          "orders"
        );


      const q =
        query(
          ordersRef,
          orderBy(
            "createdAt",
            "desc"
          )
        );


      const snapshot =
        await getDocs(q);


      if (snapshot.empty) {

        ordersList.innerHTML = `
          <div class="card empty">
            <h3>No Orders Found</h3>
            <p>এখনও কোনো customer order নেই।</p>
          </div>
        `;

        return;

      }


      ordersList.innerHTML =
        "";


      snapshot.forEach(
        function(orderDoc) {

          const order =
            orderDoc.data();


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "order-card";


          // =================================
          // Medicines
          // =================================

          let medicinesHTML =
            "";


          if (
            Array.isArray(
              order.medicines
            )
          ) {

            order.medicines.forEach(
              function(medicine) {

                medicinesHTML += `

                  <div class="medicine">

                    💊
                    ${escapeHTML(
                      medicine.name || ""
                    )}

                    — Quantity:
                    ${escapeHTML(
                      medicine.quantity || ""
                    )}

                  </div>

                `;

              }
            );

          }


          // =================================
          // Existing Values
          // =================================

          const currentMRP =
            order.originalMRP ?? "";


          const currentDiscountPercent =
            order.discountPercent ?? 10;


          const currentDiscount =
            order.discountAmount ?? "";


          const currentPayable =
            order.payableAmount ?? "";


          // =================================
          // Order Card
          // =================================

          card.innerHTML = `

            <div class="order-header">

              <div>

                <div class="order-id">

                  ${escapeHTML(
                    order.orderId ||
                    "No Order ID"
                  )}

                </div>


                <div>

                  👤 Customer:
                  ${escapeHTML(
                    order.customerName || ""
                  )}

                </div>


                <div>

                  📱 Mobile:
                  ${escapeHTML(
                    order.customerPhone || ""
                  )}

                </div>


                <div>

                  📧 Email:
                  ${escapeHTML(
                    order.customerEmail || ""
                  )}

                </div>

              </div>


              <div>

                <span class="status">

                  ${escapeHTML(
                    order.status ||
                    "Pending"
                  )}

                </span>

              </div>

            </div>


            <span class="field-title">

              💊 Medicines

            </span>


            ${medicinesHTML}


            <span class="field-title">

              🚚 Delivery Address

            </span>


            <div>

              ${escapeHTML(
                order.address || ""
              )}

            </div>


            <!-- =========================
                 ORIGINAL MRP
            ========================== -->

            <span class="field-title">

              💰 Original MRP

            </span>


            <input
              type="number"
              class="mrp-input"
              value="${currentMRP}"
              placeholder="Original MRP"
              min="0"
              step="0.01"
            >


            <!-- =========================
                 DISCOUNT PERCENT
            ========================== -->

            <span class="field-title">

              🏷️ Discount Percent (%)

            </span>


            <div class="discount-info">

              Discount Percent দিন।
              Discount Amount এবং Payable Amount automatic হিসাব হবে।

            </div>


            <input
              type="number"
              class="discount-percent-input"
              value="${currentDiscountPercent}"
              placeholder="Discount Percent"
              min="0"
              max="100"
              step="0.01"
            >


            <!-- =========================
                 DISCOUNT AMOUNT
            ========================== -->

            <span class="field-title">

              🏷️ Discount Amount

            </span>


            <input
              type="number"
              class="discount-input"
              value="${currentDiscount}"
              placeholder="Automatic Discount Amount"
              min="0"
              step="0.01"
              readonly
            >


            <!-- =========================
                 PAYABLE
            ========================== -->

            <span class="field-title">

              💵 Payable Amount

            </span>


            <input
              type="number"
              class="payable-input"
              value="${currentPayable}"
              placeholder="Automatic Payable Amount"
              min="0"
              step="0.01"
              readonly
            >


            <!-- =========================
                 CUSTOMER PAYMENT
            ========================== -->

            <span class="field-title">

              💳 Customer Payment Amount

            </span>


            <div class="payment-info">

              Customer Payment Amount = Payable Amount (Automatic)

            </div>


            <input
              type="number"
              class="payment-input"
              value="${
                order.paymentAmount ?? ""
              }"
              placeholder="Automatic Customer Payment Amount"
              min="0"
              step="0.01"
              readonly
            >


            <!-- =========================
                 PAYMENT STATUS
            ========================== -->

            <span class="field-title">

              💳 Payment Status

            </span>


            <select
              class="payment-status-input"
            >

              <option
                value="Pending"
                ${
                  order.paymentStatus ===
                  "Pending" ||
                  !order.paymentStatus
                    ? "selected"
                    : ""
                }
              >
                Pending
              </option>


              <option
                value="Paid"
                ${
                  order.paymentStatus ===
                  "Paid"
                    ? "selected"
                    : ""
                }
              >
                Paid
              </option>

            </select>


            <!-- =========================
                 ORDER STATUS
            ========================== -->

            <span class="field-title">

              🚚 Order Status

            </span>


            <select
              class="status-input"
            >

              <option
                value="Pending"
                ${
                  order.status ===
                  "Pending" ||
                  !order.status
                    ? "selected"
                    : ""
                }
              >
                Pending
              </option>


              <option
                value="Confirmed"
                ${
                  order.status ===
                  "Confirmed"
                    ? "selected"
                    : ""
                }
              >
                Confirmed
              </option>


              <option
                value="Out for Delivery"
                ${
                  order.status ===
                  "Out for Delivery"
                    ? "selected"
                    : ""
                }
              >
                Out for Delivery
              </option>


              <option
                value="Delivered"
                ${
                  order.status ===
                  "Delivered"
                    ? "selected"
                    : ""
                }
              >
                Delivered
              </option>

            </select>


            <br>


            <button
              class="btn-green save-btn"
            >
              💾 Save Changes
            </button>


            <button
              class="btn-red delete-btn"
            >
              🗑️ Delete Order
            </button>

          `;


          // =================================
          // Inputs
          // =================================

          const mrpInput =
            card.querySelector(
              ".mrp-input"
            );


          const discountPercentInput =
            card.querySelector(
              ".discount-percent-input"
            );


          const discountInput =
            card.querySelector(
              ".discount-input"
            );


          const payableInput =
            card.querySelector(
              ".payable-input"
            );


          const paymentInput =
            card.querySelector(
              ".payment-input"
            );


          // =================================
          // Automatic Calculation
          // =================================

          function calculateAmount() {

            const mrp =
              Number(
                mrpInput.value
              );


            const percent =
              Number(
                discountPercentInput.value
              );


            // Invalid MRP

            if (
              mrpInput.value === "" ||
              isNaN(mrp) ||
              mrp < 0
            ) {

              discountInput.value =
                "";

              payableInput.value =
                "";

              paymentInput.value =
                "";

              return;

            }


            // Invalid Discount Percent

            if (
              discountPercentInput.value === "" ||
              isNaN(percent) ||
              percent < 0 ||
              percent > 100
            ) {

              discountInput.value =
                "";

              payableInput.value =
                "";

              paymentInput.value =
                "";

              return;

            }


            // =================================
            // Discount Amount
            // =================================

            const discount =
              mrp * percent / 100;


            // =================================
            // Payable Amount
            // =================================

            const payable =
              mrp - discount;


            // =================================
            // Customer Payment Amount
            // =================================

            const customerPayment =
              payable;


            discountInput.value =
              discount.toFixed(2);


            payableInput.value =
              payable.toFixed(2);


            paymentInput.value =
              customerPayment.toFixed(2);

          }


          // MRP change

          mrpInput.addEventListener(
            "input",
            calculateAmount
          );


          // Discount Percent change

          discountPercentInput.addEventListener(
            "input",
            calculateAmount
          );


          // Calculate existing order

          if (
            mrpInput.value !== "" &&
            discountPercentInput.value !== ""
          ) {

            calculateAmount();

          }


          // =================================
          // Save Button
          // =================================

          const saveBtn =
            card.querySelector(
              ".save-btn"
            );


          saveBtn.addEventListener(
            "click",
            async function() {

              await saveOrder(
                orderDoc.id,
                card
              );

            }
          );


          // =================================
          // Delete Button
          // =================================

          const deleteBtn =
            card.querySelector(
              ".delete-btn"
            );


          deleteBtn.addEventListener(
            "click",
            async function() {

              await deleteOrder(
                orderDoc.id
              );

            }
          );


          ordersList.appendChild(
            card
          );

        }
      );


    } catch (error) {

      console.error(
        "Load Orders Error:",
        error
      );


      ordersList.innerHTML =
        "";


      showMessage(
        ordersMessage,
        "Orders load করা যাচ্ছে না.",
        "error"
      );

    }

  }


  // =========================================
  // Save Order
  // =========================================

  async function saveOrder(
    documentId,
    card
  ) {

    try {

      const mrp =
        card.querySelector(
          ".mrp-input"
        ).value;


      const discountPercent =
        card.querySelector(
          ".discount-percent-input"
        ).value;


      const discount =
        card.querySelector(
          ".discount-input"
        ).value;


      const payable =
        card.querySelector(
          ".payable-input"
        ).value;


      const payment =
        card.querySelector(
          ".payment-input"
        ).value;


      const paymentStatus =
        card.querySelector(
          ".payment-status-input"
        ).value;


      const status =
        card.querySelector(
          ".status-input"
        ).value;


      // =================================
      // MRP Validation
      // =================================

      if (
        mrp !== "" &&
        (
          isNaN(Number(mrp)) ||
          Number(mrp) < 0
        )
      ) {

        showMessage(
          ordersMessage,
          "Original MRP সঠিকভাবে দিন.",
          "error"
        );

        return;

      }


      // =================================
      // Discount Validation
      // =================================

      if (
        discountPercent !== "" &&
        (
          isNaN(Number(discountPercent)) ||
          Number(discountPercent) < 0 ||
          Number(discountPercent) > 100
        )
      ) {

        showMessage(
          ordersMessage,
          "Discount Percent 0 থেকে 100 এর মধ্যে দিন.",
          "error"
        );

        return;

      }


      // =================================
      // Payment = Payable
      // =================================

      const finalPayment =
        payable === ""
          ? null
          : Number(payable);


      // =================================
      // Save to Firestore
      // =================================

      await updateDoc(

        doc(
          db,
          "orders",
          documentId
        ),

        {

          originalMRP:
            mrp === ""
              ? null
              : Number(mrp),


          discountPercent:
            discountPercent === ""
              ? null
              : Number(discountPercent),


          discountAmount:
            discount === ""
              ? null
              : Number(discount),


          payableAmount:
            payable === ""
              ? null
              : Number(payable),


          paymentAmount:
            finalPayment,


          paymentStatus:
            paymentStatus,


          status:
            status

        }

      );


      showMessage(
        ordersMessage,
        "Order successfully updated. Payment Amount automatically Payable Amount-এর সমান হয়েছে.",
        "success"
      );


      await loadOrders();


    } catch (error) {

      console.error(
        "Save Order Error:",
        error
      );


      showMessage(
        ordersMessage,
        "Order update করা যায়নি.",
        "error"
      );

    }

  }


  // =========================================
  // Delete Order
  // =========================================

  async function deleteOrder(
    documentId
  ) {

    const confirmDelete =
      confirm(
        "আপনি কি এই order delete করতে চান?"
      );


    if (!confirmDelete) {

      return;

    }


    try {

      await deleteDoc(
        doc(
          db,
          "orders",
          documentId
        )
      );


      showMessage(
        ordersMessage,
        "Order deleted.",
        "success"
      );


      await loadOrders();


    } catch (error) {

      console.error(
        "Delete Order Error:",
        error
      );


      showMessage(
        ordersMessage,
        "Order delete করা যায়নি.",
        "error"
      );

    }

  }


  // =========================================
  // Refresh
  // =========================================

  refreshBtn.addEventListener(
    "click",
    function() {

      loadOrders();

    }
  );


  // =========================================
  // HTML Security
  // =========================================

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }
