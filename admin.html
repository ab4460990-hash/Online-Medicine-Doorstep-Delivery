<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Medicine Doorstep Delivery - Admin Panel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#222}
header{background:#087c59;color:white;padding:18px 15px;text-align:center}
header h1{font-size:22px}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h2{color:#087c59;margin-bottom:15px}
input,select,button{width:100%;padding:12px;margin-top:8px;margin-bottom:12px;border-radius:8px;border:1px solid #ccc;font-size:15px}
button{border:none;cursor:pointer;font-weight:bold}
.login-btn{background:#087c59;color:white}
.refresh-btn{background:#2563eb;color:white}
.logout-btn{background:#dc2626;color:white}
.save-btn{background:#087c59;color:white}
.delete-btn{background:#dc2626;color:white}
button:hover{opacity:.9}
button:disabled{opacity:.6;cursor:not-allowed}
.hidden{display:none}
.message{padding:12px;border-radius:8px;margin-top:10px;display:none}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.order-card{border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:18px;background:#fff}
.order-title{font-size:19px;font-weight:bold;color:#087c59;margin-bottom:12px}
.info{margin:7px 0;line-height:1.5}
.medicines{background:#f8fafc;padding:12px;border-radius:8px;margin:12px 0}
.medicine-item{padding:7px 0;border-bottom:1px solid #ddd}
.medicine-item:last-child{border-bottom:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{margin-top:15px;margin-bottom:5px;font-weight:bold;color:#444}
.readonly{background:#f3f4f6}
.top-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small-note{font-size:13px;color:#64748b;margin-top:-5px;margin-bottom:10px}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .top-buttons{grid-template-columns:1fr}
  header h1{font-size:18px}
  .container{margin-top:15px}
}
</style>
</head>

<body>

<header>
  <h1>💊 Online Medicine Doorstep Delivery</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

  <div id="loginSection" class="card">
    <h2>🔐 Admin Login</h2>

    <input type="email" id="email" placeholder="Admin Email" autocomplete="email">

    <input type="password" id="password" placeholder="Password" autocomplete="current-password">

    <button class="login-btn" id="loginBtn">Login</button>

    <div id="loginMessage" class="message"></div>
  </div>

  <div id="adminSection" class="hidden">

    <div class="card">
      <h2>📦 Order Management</h2>

      <div class="top-buttons">
        <button class="refresh-btn" id="refreshBtn">🔄 Refresh Orders</button>
        <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
      </div>

      <div id="adminMessage" class="message"></div>
    </div>

    <div id="ordersContainer"></div>

  </div>
</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBfBAo9GW1bDu-IlFy_hha_uOdUmsRSiF8",
  authDomain: "online-medicine-delivery-74346.firebaseapp.com",
  projectId: "online-medicine-delivery-74346",
  storageBucket: "online-medicine-delivery-74346.firebasestorage.app",
  messagingSenderId: "1061955108881",
  appId: "1:1061955108881:web:64f36ad79b5c612a2171b0",
  measurementId: "G-LMHDFF01QC"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const refreshBtn = document.getElementById("refreshBtn");
const loginMessage = document.getElementById("loginMessage");
const adminMessage = document.getElementById("adminMessage");
const ordersContainer = document.getElementById("ordersContainer");


function showMessage(element, message, type){
  element.textContent = message;
  element.className = "message " + type;
  element.style.display = "block";
}


function escapeHTML(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


loginBtn.addEventListener("click", async function(){

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    showMessage(
      loginMessage,
      "Please enter email and password.",
      "error"
    );
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try{
    await signInWithEmailAndPassword(auth,email,password);

  }catch(error){

    console.error(error);

    let message = "Login failed.";

    if(error.code === "auth/invalid-credential"){
      message = "Invalid email or password.";
    }else if(error.code === "auth/user-not-found"){
      message = "Admin account not found.";
    }else if(error.code === "auth/wrong-password"){
      message = "Wrong password.";
    }else if(error.code === "auth/invalid-email"){
      message = "Invalid email address.";
    }else if(error.code === "auth/too-many-requests"){
      message = "Too many attempts. Please try again later.";
    }else{
      message = error.message;
    }

    showMessage(loginMessage,message,"error");

  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});


onAuthStateChanged(auth, async function(user){

  if(user){

    try{

      const adminRef = doc(db,"admins",user.uid);
      const adminSnap = await getDoc(adminRef);

      if(!adminSnap.exists()){

        showMessage(
          loginMessage,
          "This account is not registered as an admin.",
          "error"
        );

        await signOut(auth);
        return;
      }

      loginSection.classList.add("hidden");
      adminSection.classList.remove("hidden");

      loadOrders();

    }catch(error){

      console.error(error);

      showMessage(
        loginMessage,
        "Admin verification failed: " + error.message,
        "error"
      );
    }

  }else{

    loginSection.classList.remove("hidden");
    adminSection.classList.add("hidden");
  }
});


logoutBtn.addEventListener("click", async function(){

  try{
    await signOut(auth);
  }catch(error){
    console.error(error);
  }
});


async function loadOrders(){

  ordersContainer.innerHTML =
    "<div class='card'>Loading orders...</div>";

  try{

    /*
      Read both collections:
      1. publicOrders = current guest-order system
      2. orders      = older order records

      This prevents old orders from losing Customer/Address information.
    */

    const publicQuery = query(
      collection(db,"publicOrders"),
      orderBy("createdAt","desc")
    );

    const oldQuery = query(
      collection(db,"orders"),
      orderBy("createdAt","desc")
    );

    const [publicSnapshot, oldSnapshot] =
      await Promise.all([
        getDocs(publicQuery),
        getDocs(oldQuery)
      ]);

    const allOrders = [];

    publicSnapshot.forEach(function(orderDoc){
      allOrders.push({
        documentId: orderDoc.id,
        collectionName: "publicOrders",
        data: orderDoc.data()
      });
    });

    oldSnapshot.forEach(function(orderDoc){
      allOrders.push({
        documentId: orderDoc.id,
        collectionName: "orders",
        data: orderDoc.data()
      });
    });

    /*
      Remove duplicate Order IDs.
      publicOrders is preferred when the same Order ID exists
      in both collections.
    */

    const uniqueOrders = new Map();

    allOrders.forEach(function(item){

      const orderId =
        item.data.orderId || item.documentId;

      if(
        !uniqueOrders.has(orderId) ||
        item.collectionName === "publicOrders"
      ){
        uniqueOrders.set(orderId,item);
      }
    });

    const orders = Array.from(
      uniqueOrders.values()
    );

    orders.sort(function(a,b){

      const aSeconds =
        a.data.createdAt?.seconds || 0;

      const bSeconds =
        b.data.createdAt?.seconds || 0;

      return bSeconds - aSeconds;
    });


    if(orders.length === 0){

      ordersContainer.innerHTML =
        "<div class='card'><h2>No orders found.</h2></div>";

      return;
    }


    ordersContainer.innerHTML = "";

    orders.forEach(function(item){

      createOrderCard(
        item.documentId,
        item.data,
        item.collectionName
      );

    });


    showMessage(
      adminMessage,
      "Orders loaded successfully.",
      "success"
    );


  }catch(error){

    console.error(error);

    ordersContainer.innerHTML =
      "<div class='card'>" +
      "<h2>Unable to load orders</h2>" +
      "<p>" +
      escapeHTML(error.message) +
      "</p>" +
      "</div>";

    showMessage(
      adminMessage,
      "Could not load orders.",
      "error"
    );
  }
}

function createOrderCard(documentId,order,collectionName){

  const card = document.createElement("div");
  card.className = "order-card";

  const medicines = Array.isArray(order.medicines)
    ? order.medicines
    : [];

  let medicineHTML = "";

  if(medicines.length > 0){

    medicines.forEach(function(medicine){

      medicineHTML += `
        <div class="medicine-item">
          <strong>💊 ${escapeHTML(medicine.name || "Medicine")}</strong>
          <br>
          Quantity: ${escapeHTML(medicine.quantity || 1)}
        </div>
      `;
    });

  }else{

    medicineHTML =
      "<div>No medicine information found.</div>";
  }


  const originalMRP = order.originalMRP ?? "";
  const discountPercent = order.discountPercent ?? "";
  const paymentStatus = order.paymentStatus || "Pending";
  const status = order.status || "Pending";

  const currentEstimatedTime =
    order.estimatedDeliveryTime ||
    order.estimatedDelivery ||
    "";


  card.innerHTML = `

    <div class="order-title">
      🧾 Order ID:
      ${escapeHTML(order.orderId || documentId)}
    </div>

    <div class="info">
      <strong>Customer Name:</strong>
      ${escapeHTML(
        order.customerName ||
        order.fullName ||
        order.name ||
        ""
      )}
    </div>

    <div class="info">
      <strong>Mobile:</strong>
      ${escapeHTML(
        order.customerPhone ||
        order.mobile ||
        order.phone ||
        ""
      )}
    </div>

    <div class="info">
      <strong>Address:</strong>
      ${escapeHTML(
        order.address ||
        order.deliveryAddress ||
        order.customerAddress ||
        ""
      )}
    </div>

    <div class="info">
      <strong>Current Estimated Delivery:</strong>
      ${escapeHTML(currentEstimatedTime || "Not specified")}
    </div>

    <div class="info">
      <strong>Payment Method:</strong>
      ${escapeHTML(
        order.paymentMethod ||
        "Not specified"
      )}
    </div>


    <div class="medicines">

      <div class="section-title">
        💊 Medicines
      </div>

      ${medicineHTML}

    </div>


    <div class="section-title">
      🚚 Set Estimated Delivery Time
    </div>

    <select class="estimated-delivery-input">

      <option value="30–60 minutes"
        ${currentEstimatedTime === "30–60 minutes" ? "selected" : ""}>
        30–60 minutes
      </option>

      <option value="1–2 hours"
        ${currentEstimatedTime === "1–2 hours" ? "selected" : ""}>
        1–2 hours
      </option>

      <option value="2–4 hours"
        ${currentEstimatedTime === "2–4 hours" ? "selected" : ""}>
        2–4 hours
      </option>

      <option value="Today"
        ${currentEstimatedTime === "Today" ? "selected" : ""}>
        Today
      </option>

      <option value="Tomorrow"
        ${currentEstimatedTime === "Tomorrow" ? "selected" : ""}>
        Tomorrow
      </option>

    </select>

    <div class="small-note">
      Select the delivery time and press Save Order.
    </div>


    <div class="section-title">
      💰 Payment Details
    </div>

    <div class="grid">

      <div>
        <label>Original MRP</label>

        <input
          type="number"
          min="0"
          step="0.01"
          class="mrp-input"
          value="${escapeHTML(originalMRP)}"
          placeholder="Original MRP"
        >
      </div>


      <div>
        <label>Discount Percent (%)</label>

        <input
          type="number"
          min="0"
          max="100"
          step="0.01"
          class="discount-percent-input"
          value="${escapeHTML(discountPercent)}"
          placeholder="Discount %"
        >
      </div>


      <div>
        <label>Discount Amount</label>

        <input
          type="number"
          class="discount-input readonly"
          readonly
          placeholder="Discount Amount"
        >
      </div>


      <div>
        <label>Payable Amount</label>

        <input
          type="number"
          class="payable-input readonly"
          readonly
          placeholder="Payable Amount"
        >
      </div>


      <div>
        <label>Customer Payment Amount</label>

        <input
          type="number"
          class="payment-input readonly"
          readonly
          placeholder="Customer Payment"
        >
      </div>

    </div>


    <div class="section-title">
      💳 Payment Status
    </div>

    <select class="payment-status">

      <option value="Pending"
        ${paymentStatus === "Pending" ? "selected" : ""}>
        Pending
      </option>

      <option value="Paid"
        ${paymentStatus === "Paid" ? "selected" : ""}>
        Paid
      </option>

      <option value="Failed"
        ${paymentStatus === "Failed" ? "selected" : ""}>
        Failed
      </option>

    </select>


    <div class="section-title">
      📦 Order Status
    </div>

    <select class="order-status">

      <option value="Pending"
        ${status === "Pending" ? "selected" : ""}>
        Pending
      </option>

      <option value="Confirmed"
        ${status === "Confirmed" ? "selected" : ""}>
        Confirmed
      </option>

      <option value="Out for Delivery"
        ${status === "Out for Delivery" ? "selected" : ""}>
        Out for Delivery
      </option>

      <option value="Delivered"
        ${status === "Delivered" ? "selected" : ""}>
        Delivered
      </option>

    </select>


    <button class="save-btn">
      💾 Save Order
    </button>

    <button class="delete-btn">
      🗑️ Delete Order
    </button>

  `;


  ordersContainer.appendChild(card);


  const mrpInput =
    card.querySelector(".mrp-input");

  const discountPercentInput =
    card.querySelector(".discount-percent-input");

  const discountInput =
    card.querySelector(".discount-input");

  const payableInput =
    card.querySelector(".payable-input");

  const paymentInput =
    card.querySelector(".payment-input");

  const estimatedDeliveryInput =
    card.querySelector(".estimated-delivery-input");


  function calculatePayment(){

    const mrp = parseFloat(mrpInput.value);

    let percent =
      parseFloat(discountPercentInput.value);

    if(isNaN(mrp) || mrp < 0){

      discountInput.value = "";
      payableInput.value = "";
      paymentInput.value = "";

      return;
    }

    if(isNaN(percent)){
      percent = 0;
    }

    if(percent < 0) percent = 0;
    if(percent > 100) percent = 100;

    const discount = mrp * percent / 100;
    const payable = mrp - discount;

    discountInput.value =
      discount.toFixed(2);

    payableInput.value =
      payable.toFixed(2);

    paymentInput.value =
      payable.toFixed(2);
  }


  mrpInput.addEventListener(
    "input",
    calculatePayment
  );

  discountPercentInput.addEventListener(
    "input",
    calculatePayment
  );

  calculatePayment();


  const saveBtn =
    card.querySelector(".save-btn");


  saveBtn.addEventListener(
    "click",
    async function(){

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      try{

        const mrpValue =
          mrpInput.value.trim();

        const discountPercentValue =
          discountPercentInput.value.trim();

        const discountValue =
          discountInput.value.trim();

        const payableValue =
          payableInput.value.trim();

        const paymentValue =
          paymentInput.value.trim();

        const paymentStatus =
          card.querySelector(
            ".payment-status"
          ).value;

        const orderStatus =
          card.querySelector(
            ".order-status"
          ).value;

        const estimatedDeliveryTime =
          estimatedDeliveryInput.value;


        await updateDoc(

          doc(
            db,
            collectionName,
            documentId
          ),

          {

            originalMRP:
              mrpValue === ""
                ? null
                : Number(mrpValue),

            discountPercent:
              discountPercentValue === ""
                ? null
                : Number(
                    discountPercentValue
                  ),

            discountAmount:
              discountValue === ""
                ? null
                : Number(discountValue),

            payableAmount:
              payableValue === ""
                ? null
                : Number(payableValue),

            paymentAmount:
              paymentValue === ""
                ? null
                : Number(paymentValue),

            paymentStatus:
              paymentStatus,

            status:
              orderStatus,

            estimatedDeliveryTime:
              estimatedDeliveryTime
          }
        );


        showMessage(
          adminMessage,
          "Order saved successfully. Estimated delivery time updated.",
          "success"
        );


        saveBtn.textContent =
          "✅ Saved";

        setTimeout(function(){
          saveBtn.textContent =
            "💾 Save Order";
        },1500);


      }catch(error){

        console.error(error);

        showMessage(
          adminMessage,
          "Could not save order: " +
          error.message,
          "error"
        );

        saveBtn.textContent =
          "💾 Save Order";

      }finally{

        saveBtn.disabled = false;
      }
    }
  );


  const deleteBtn =
    card.querySelector(".delete-btn");


  deleteBtn.addEventListener(
    "click",
    async function(){

      const confirmDelete =
        confirm(
          "Are you sure you want to delete this order?"
        );

      if(!confirmDelete){
        return;
      }

      deleteBtn.disabled = true;
      deleteBtn.textContent = "Deleting...";


      try{

        await deleteDoc(
          doc(
            db,
            "publicOrders",
            documentId
          )
        );


        card.remove();

        showMessage(
          adminMessage,
          "Order deleted successfully.",
          "success"
        );


      }catch(error){

        console.error(error);

        showMessage(
          adminMessage,
          "Could not delete order: " +
          error.message,
          "error"
        );

        deleteBtn.disabled = false;
        deleteBtn.textContent =
          "🗑️ Delete Order";
      }
    }
  );
}


refreshBtn.addEventListener(
  "click",
  loadOrders
);

</script>

</body>
</html>
