<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Online Medicine Doorstep Delivery - Admin Panel</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f7f6;color:#222}
header{background:#087c59;color:#fff;padding:20px;text-align:center}
.container{max-width:1000px;margin:20px auto;padding:0 15px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);margin-bottom:18px}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{padding:12px 16px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
.login-btn,.save-btn{background:#087c59;color:#fff}
.logout-btn,.delete-btn{background:#d62828;color:#fff}
.refresh-btn{background:#555;color:#fff}
.top-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
.message{display:none;margin-top:12px;padding:12px;border-radius:8px;font-weight:700}
.success{background:#d9f5e9;color:#087c59}
.error{background:#ffe0e0;color:#b00020}
.order-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.08);margin:18px 0}
.order-title{font-size:19px;font-weight:700;color:#087c59;margin-bottom:15px}
.info{padding:8px 0;border-bottom:1px solid #eee;word-break:break-word}
.info strong{color:#087c59}
.section-title{font-weight:700;margin-top:17px;margin-bottom:6px;color:#444}
.medicine-item{background:#f7faf9;padding:10px;border-radius:8px;margin:7px 0;border:1px solid #e0e0e0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.readonly{background:#f0f2f2}
.small-note{font-size:13px;color:#666}
@media(max-width:650px){.grid,.top-buttons{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>💊 Online Medicine Doorstep Delivery</h1><p>Admin Panel</p></header>
<div class="container">
<div id="loginSection" class="card">
<h2>🔐 Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" class="login-btn">Login</button>
<div id="loginMessage" class="message"></div>
</div>

<div id="adminSection" class="hidden">
<div class="card">
<h2>📦 Order Management</h2>
<div class="top-buttons">
<button id="refreshBtn" class="refresh-btn">🔄 Refresh Orders</button>
<button id="logoutBtn" class="logout-btn">🚪 Logout</button>
</div>
<div id="adminMessage" class="message"></div>
</div>
<div id="ordersContainer"></div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBfBAo9GW1bDu-IlFy_hha_uOdUmsRSiF8",
  authDomain: "online-medicine-delivery-74346.firebaseapp.com",
  projectId: "online-medicine-delivery-74346",
  storageBucket: "online-medicine-delivery-74346.firebasestorage.app",
  messagingSenderId: "1061955108881",
  appId: "1:1061955108881:web:64f36ad79b5c612a2171b0",
  measurementId: "G-LMHDFF01QC"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const loginSection=document.getElementById("loginSection"),adminSection=document.getElementById("adminSection");
const email=document.getElementById("email"),password=document.getElementById("password"),loginBtn=document.getElementById("loginBtn"),logoutBtn=document.getElementById("logoutBtn"),refreshBtn=document.getElementById("refreshBtn");
const loginMessage=document.getElementById("loginMessage"),adminMessage=document.getElementById("adminMessage"),ordersContainer=document.getElementById("ordersContainer");

function msg(el,text,type){el.textContent=text;el.className="message "+type;el.style.display="block";}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

loginBtn.onclick=async()=>{
  const e=email.value.trim(),p=password.value;
  if(!e||!p)return msg(loginMessage,"Please enter email and password.","error");
  loginBtn.disabled=true;loginBtn.textContent="Logging in...";
  try{await signInWithEmailAndPassword(auth,e,p);}
  catch(error){console.error(error);msg(loginMessage,error.message,"error");}
  finally{loginBtn.disabled=false;loginBtn.textContent="Login";}
};

logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  if(!user){loginSection.classList.remove("hidden");adminSection.classList.add("hidden");return;}
  try{
    const snap=await getDoc(doc(db,"admins",user.uid));
    if(!snap.exists()){await signOut(auth);return msg(loginMessage,"This account is not registered as an admin.","error");}
    loginSection.classList.add("hidden");adminSection.classList.remove("hidden");loadOrders();
  }catch(error){console.error(error);msg(loginMessage,"Admin verification failed: "+error.message,"error");}
});

function timestampValue(v){return v?.seconds ? v.seconds : 0;}

async function loadCollection(name){
  const snap=await getDocs(collection(db,name));
  const arr=[];
  snap.forEach(d=>arr.push({documentId:d.id,collectionName:name,data:d.data()}));
  return arr;
}

async function loadOrders(){
  ordersContainer.innerHTML='<div class="card">Loading orders...</div>';
  try{
    const [publicOrders,oldOrders]=await Promise.all([loadCollection("publicOrders"),loadCollection("orders")]);
    const map=new Map();
    [...oldOrders,...publicOrders].forEach(item=>{
      const id=item.data.orderId||item.documentId;
      if(!map.has(id)||item.collectionName==="publicOrders")map.set(id,item);
    });
    const orders=[...map.values()].sort((a,b)=>timestampValue(b.data.createdAt)-timestampValue(a.data.createdAt));
    if(!orders.length){ordersContainer.innerHTML='<div class="card"><h2>No orders found.</h2></div>';return;}
    ordersContainer.innerHTML="";
    orders.forEach(item=>createOrderCard(item));
    msg(adminMessage,orders.length+" order(s) loaded.","success");
  }catch(error){
    console.error(error);
    ordersContainer.innerHTML='<div class="card"><b>Could not load orders:</b> '+esc(error.message)+'</div>';
    msg(adminMessage,"Could not load orders.","error");
  }
}

function createOrderCard(item){
  const order=item.data,id=item.documentId,collectionName=item.collectionName;
  const card=document.createElement("div");card.className="order-card";
  const meds=Array.isArray(order.medicines)?order.medicines:[];
  const medicineHTML=meds.length?meds.map((m,i)=>`<div class="medicine-item"><b>💊 Medicine ${i+1}:</b> ${esc(m.name||"N/A")}<br><b>Quantity:</b> ${esc(m.quantity)} ${esc(m.unit||"")}</div>`).join(""):"<div>No medicine information found.</div>";
  const address=order.address||order.deliveryAddress||order.customerAddress||"";
  const name=order.customerName||order.fullName||order.name||"";
  const phone=order.customerPhone||order.mobile||order.phone||"";
  const estimated=order.estimatedDeliveryTime||order.estimatedDelivery||"";
  const mrp=order.originalMRP??"";
  const disc=order.discountPercent??10;
  const payStatus=order.paymentStatus||"Pending";
  const status=order.status||"Pending";
  card.innerHTML=`
  <div class="order-title">🧾 Order ID: ${esc(order.orderId||id)}</div>
  <div class="info"><strong>Customer Name:</strong> ${esc(name)}</div>
  <div class="info"><strong>Mobile:</strong> ${esc(phone)}</div>
  <div class="info"><strong>🏠 Address:</strong> ${esc(address||"Address not provided")}</div>
  <div class="info"><strong>💳 Payment Method:</strong> ${esc(order.paymentMethod||"Cash on Delivery")}</div>
  <div class="section-title">💊 Medicines</div>${medicineHTML}
  <div class="section-title">🚚 Estimated Delivery Time</div>
  <select class="estimated">
    <option value="30–60 minutes">30–60 minutes</option>
    <option value="1–2 hours">1–2 hours</option>
    <option value="2–4 hours">2–4 hours</option>
    <option value="Today">Today</option>
    <option value="Tomorrow">Tomorrow</option>
  </select>
  <div class="small-note">Change the time, then press Save Order.</div>
  <div class="section-title">💰 Payment Details</div>
  <div class="grid">
    <div><label>Original MRP</label><input class="mrp" type="number" min="0" step="0.01" value="${esc(mrp)}"></div>
    <div><label>Discount %</label><input class="discountPercent" type="number" min="0" max="100" step="0.01" value="${esc(disc)}"></div>
    <div><label>Discount Amount</label><input class="discountAmount readonly" readonly></div>
    <div><label>Payable Amount</label><input class="payable readonly" readonly></div>
    <div><label>Customer Payment Amount</label><input class="paymentAmount readonly" readonly></div>
  </div>
  <div class="section-title">💳 Payment Status</div>
  <select class="paymentStatus"><option>Pending</option><option>Paid</option><option>Failed</option></select>
  <div class="section-title">📦 Order Status</div>
  <select class="orderStatus"><option>Pending</option><option>Confirmed</option><option>Out for Delivery</option><option>Delivered</option></select>
  <br><br>
  <button class="save-btn">💾 Save Order</button>
  <button class="delete-btn">🗑️ Delete Order</button>
  `;
  ordersContainer.appendChild(card);

  const estimatedInput=card.querySelector(".estimated");
  const paymentStatusInput=card.querySelector(".paymentStatus");
  const statusInput=card.querySelector(".orderStatus");
  estimatedInput.value=estimated||"30–60 minutes";
  if(![...estimatedInput.options].some(o=>o.value===estimatedInput.value))estimatedInput.value="30–60 minutes";
  paymentStatusInput.value=payStatus;
  statusInput.value=status;

  const mrpInput=card.querySelector(".mrp"),percentInput=card.querySelector(".discountPercent");
  const discountInput=card.querySelector(".discountAmount"),payableInput=card.querySelector(".payable"),paymentInput=card.querySelector(".paymentAmount");

  function calc(){
    const m=parseFloat(mrpInput.value),p=Math.min(100,Math.max(0,parseFloat(percentInput.value)||0));
    if(!Number.isFinite(m)||m<0){discountInput.value="";payableInput.value="";paymentInput.value="";return;}
    const d=m*p/100,total=m-d;discountInput.value=d.toFixed(2);payableInput.value=total.toFixed(2);paymentInput.value=total.toFixed(2);
  }
  mrpInput.oninput=calc;percentInput.oninput=calc;calc();

  card.querySelector(".save-btn").onclick=async()=>{
    const btn=card.querySelector(".save-btn");btn.disabled=true;btn.textContent="Saving...";
    try{
      await updateDoc(doc(db,collectionName,id),{
        originalMRP:mrpInput.value===""?null:Number(mrpInput.value),
        discountPercent:percentInput.value===""?null:Number(percentInput.value),
        discountAmount:discountInput.value===""?null:Number(discountInput.value),
        payableAmount:payableInput.value===""?null:Number(payableInput.value),
        paymentAmount:paymentInput.value===""?null:Number(paymentInput.value),
        paymentStatus:paymentStatusInput.value,
        status:statusInput.value,
        estimatedDeliveryTime:estimatedInput.value
      });
      msg(adminMessage,"Order saved. Estimated delivery time updated.","success");btn.textContent="✅ Saved";
      setTimeout(()=>btn.textContent="💾 Save Order",1200);
    }catch(error){console.error(error);msg(adminMessage,"Could not save: "+error.message,"error");btn.textContent="💾 Save Order";}
    finally{btn.disabled=false;}
  };

  card.querySelector(".delete-btn").onclick=async()=>{
    if(!confirm("Delete this order?"))return;
    const btn=card.querySelector(".delete-btn");btn.disabled=true;btn.textContent="Deleting...";
    try{await deleteDoc(doc(db,collectionName,id));card.remove();msg(adminMessage,"Order deleted.","success");}
    catch(error){console.error(error);msg(adminMessage,"Could not delete: "+error.message,"error");btn.disabled=false;btn.textContent="🗑️ Delete Order";}
  };
}

refreshBtn.onclick=loadOrders;
</script>
</body>
</html>
